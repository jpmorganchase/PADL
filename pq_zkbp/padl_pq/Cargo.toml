[package]
name = "padl_pq"
version = "0.1.0"
edition = "2024"

[lib]
name="padl_pq"
crate-type = ["cdylib", "lib"]

[dependencies]
rayon="1.11.0"
rand="0.9.1"
# rand_old={version="0.8.5", package="rand"}
discrete-gaussian="0.0.6"
num-traits = "0.2"
num-bigint = "0.4"
# crypto-bigint="0.6.1"
rug = "1.24"
lazy_static= "1.5.0"
ark-ff = "0.4"
ark-std = "0.4"
ark-serialize = "0.4"
# ark-test-curves = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
sha3="0.10"
# padl_pq_sampler ={ path = "../padl_pq_sampler"}

[dev-dependencies]
criterion = {version ="0.5"}
plotpy= "*"
statrs="0.18.0"

[[bench]]
name = "my_benchmark"
harness=false

[profile.dev]
opt-level=2

[profile.bench]
debug=true
inherits = "release" # Start from release settings
opt-level=3
[profile.samply]
inherits = "release"
debug = true

[features]
default = ["d1024"]
# default = ["d256"]
d1024 = []
d256 = []